<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chevron Lines (C & F) Ltd. - Leave Management System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel In-Browser Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QRCode JS -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Supabase Configuration
    const SUPABASE_URL = 'https://vhlzalgatarrrobjympc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZobHphbGdhdGFycnJvYmp5bXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5ODI3ODksImV4cCI6MjA5MTU1ODc4OX0.DngGAcPst8pUwcz4NpuXEYdEk70BQoqOjXS78bAv8FU';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DEPARTMENTS = [
      'C&F Customs',
      'Customs Jetty',
      'Accounts',
      'Port/Jetty (Operations)',
      'DO Section',
      'Freight Forwarding',
      'Administration'
    ];

    function parseDMY(dateStr) {
      if (!dateStr) return new Date();
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        if (parts[0].length === 4) return new Date(dateStr);
        return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
      }
      return new Date(dateStr);
    }

    function calculateDays(start, end) {
      if (!start || !end) return 1;
      const d1 = parseDMY(start);
      const d2 = parseDMY(end);
      const diffTime = Math.abs(d2 - d1);
      return Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1);
    }

    function App() {
      const [employees, setEmployees] = useState([]);
      const [leaves, setLeaves] = useState([]);
      const [loading, setLoading] = useState(true);
      const [currentSession, setCurrentSession] = useState(() => {
        const s = localStorage.getItem('cl_lms_user');
        return s ? JSON.parse(s) : null;
      });

      const [activeTab, setActiveTab] = useState('my-leaves');
      const [toast, setToast] = useState(null);

      // Modals
      const [isApplyOpen, setIsApplyOpen] = useState(false);
      const [isPendingOpen, setIsPendingOpen] = useState(false);
      const [isEmployeeModalOpen, setIsEmployeeModalOpen] = useState(false);
      const [editEmployee, setEditEmployee] = useState(null);
      const [viewProfileEmp, setViewProfileEmp] = useState(null);
      const [printPassLeave, setPrintPassLeave] = useState(null);
      const [isMonthlyReportOpen, setIsMonthlyReportOpen] = useState(false);
      const [editingLeave, setEditingLeave] = useState(null);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const fetchData = async () => {
        setLoading(true);
        try {
          const { data: empData, error: empErr } = await supabase.from('employees').select('*');
          if (!empErr && empData) setEmployees(empData);

          const { data: leaveData, error: leaveErr } = await supabase.from('leaves').select('*').order('id', { ascending: false });
          if (!leaveErr && leaveData) setLeaves(leaveData);
        } catch (e) {
          console.error('Fetch error:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      const handleLogin = (user, roleOverride) => {
        if (user.status === 'Inactive') {
          showToast('Account is inactive/resigned. Please contact HR.', 'error');
          return;
        }
        const session = {
          id: user.id,
          name: user.name,
          role: roleOverride || user.role,
          department: user.department,
          type: (roleOverride || user.role) === 'Admin' ? 'ADMIN' : 'USER',
          tl: user.tl || 'None',
          employee_code: user.employee_code
        };
        setCurrentSession(session);
        localStorage.setItem('cl_lms_user', JSON.stringify(session));
        showToast(`Logged in as ${session.name} (${session.role})`);
      };

      const handleLogout = () => {
        setCurrentSession(null);
        localStorage.removeItem('cl_lms_user');
        showToast('Logged out successfully');
      };

      const pendingQueue = useMemo(() => {
        if (!currentSession) return [];
        return leaves.filter(l => {
          if (currentSession.role === 'Manager') {
            return l.status === 'Pending Manager Review' || l.status === 'Pending TL Review';
          }
          if (currentSession.role === 'TeamLeader') {
            return l.status === 'Pending TL Review' && (l.applicant_tl === currentSession.name);
          }
          return false;
        });
      }, [leaves, currentSession]);

      // Save Employee (Without Bank/Salary fields)
      const handleSaveEmployee = async (formData) => {
        try {
          if (formData.id) {
            const { error } = await supabase.from('employees').update(formData).eq('id', formData.id);
            if (error) throw error;
            setEmployees(prev => prev.map(e => e.id === formData.id ? { ...e, ...formData } : e));
            showToast('Employee profile updated');
          } else {
            const newId = Date.now();
            const record = { ...formData, id: newId };
            const { error } = await supabase.from('employees').insert([record]);
            if (error) throw error;
            setEmployees(prev => [record, ...prev]);
            showToast('New employee registered');
          }
          setIsEmployeeModalOpen(false);
        } catch (e) {
          showToast(e.message || 'Failed to save employee', 'error');
        }
      };

      // Submit Leave Application
      const handleSaveLeave = async (leaveData) => {
        try {
          if (leaveData.id) {
            const { error } = await supabase.from('leaves').update(leaveData).eq('id', leaveData.id);
            if (error) throw error;
            setLeaves(prev => prev.map(l => l.id === leaveData.id ? { ...l, ...leaveData } : l));
            showToast('Leave request updated');
          } else {
            let initialStatus = 'Pending TL Review';
            let approverRole = 'TeamLeader';
            if (currentSession.tl === 'None' || currentSession.role === 'TeamLeader' || currentSession.role === 'Manager') {
              initialStatus = 'Pending Manager Review';
              approverRole = 'Manager';
            }
            const newRecord = {
              applicant_id: currentSession.id,
              applicant_name: currentSession.name,
              applicant_tl: currentSession.tl || 'None',
              type: leaveData.type,
              start_date: leaveData.start_date,
              end_date: leaveData.end_date,
              reason: leaveData.reason,
              status: initialStatus,
              approver_role: approverRole
            };
            const { data, error } = await supabase.from('leaves').insert([newRecord]).select();
            if (error) throw error;
            const saved = (data && data[0]) ? data[0] : { ...newRecord, id: Date.now() };
            setLeaves(prev => [saved, ...prev]);
            showToast('Leave application submitted to leaves table');
          }
          setIsApplyOpen(false);
          setEditingLeave(null);
        } catch (e) {
          showToast(e.message || 'Error submitting leave', 'error');
        }
      };

      const handleApproveReject = async (leaveId, action) => {
        const leave = leaves.find(l => l.id === leaveId);
        if (!leave) return;

        let newStatus = action === 'REJECT' ? 'Rejected' : action === 'FORWARD' ? 'Pending Manager Review' : 'Approved';
        const payload = {
          status: newStatus,
          approver: currentSession.name,
          approver_role: currentSession.role
        };

        try {
          const { error } = await supabase.from('leaves').update(payload).eq('id', leaveId);
          if (error) throw error;
          setLeaves(prev => prev.map(l => l.id === leaveId ? { ...l, ...payload } : l));
          showToast(`Application ${newStatus.toLowerCase()}`);
        } catch (e) {
          showToast('Update failed', 'error');
        }
      };

      const handleDeleteLeave = async (id) => {
        if (!confirm('Cancel and remove this leave application?')) return;
        try {
          const { error } = await supabase.from('leaves').delete().eq('id', id);
          if (error) throw error;
          setLeaves(prev => prev.filter(l => l.id !== id));
          showToast('Application cancelled');
        } catch (e) {
          showToast('Could not delete', 'error');
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-900 text-white">
            <div className="text-center space-y-3">
              <div className="w-10 h-10 border-4 border-sky-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p className="text-sm font-semibold">Connecting to Supabase (employees & leaves)...</p>
            </div>
          </div>
        );
      }

      if (!currentSession) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full border border-slate-100">
              <div className="text-center space-y-2 mb-6">
                <div className="w-14 h-14 bg-sky-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg">CL</div>
                <h1 className="text-xl font-extrabold text-slate-900">Chevron Lines (C & F) Ltd.</h1>
                <p className="text-xs text-slate-500">Aziz Court (5th Floor) 88-90, Agrabad C/A, Chittagong</p>
                <span className="inline-block bg-sky-50 text-sky-700 text-[10px] font-bold px-3 py-1 rounded-full border border-sky-200">
                  Leave Management & HR Portal
                </span>
              </div>
              <div className="space-y-3">
                <p className="text-xs font-bold text-slate-700 uppercase tracking-wider text-center">Select Profile to Test Live:</p>
                <div className="grid grid-cols-1 gap-2 max-h-72 overflow-y-auto pr-1">
                  <button
                    onClick={() => handleLogin({ id: 0, name: 'System Administrator', role: 'Admin', department: 'Administration' }, 'Admin')}
                    className="w-full text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white transition flex justify-between items-center"
                  >
                    <div>
                      <div className="font-bold text-xs">System Administrator</div>
                      <div className="text-[10px] text-slate-400">Master Directory & System Control</div>
                    </div>
                    <span className="bg-sky-500 text-[10px] font-bold px-2 py-0.5 rounded text-white">ADMIN</span>
                  </button>
                  {employees.map(emp => (
                    <button
                      key={emp.id}
                      onClick={() => handleLogin(emp)}
                      className="w-full text-left p-3 rounded-xl bg-slate-50 hover:bg-sky-50 border border-slate-200 transition flex justify-between items-center"
                    >
                      <div>
                        <div className="font-bold text-xs text-slate-800">{emp.name}</div>
                        <div className="text-[10px] text-slate-500">{emp.designation || emp.role} • {emp.department}</div>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                        emp.role === 'Manager' ? 'bg-indigo-100 text-indigo-700' :
                        emp.role === 'TeamLeader' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-700'
                      }`}>
                        {emp.role}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-sky-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-base">CL</div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base text-slate-900 leading-tight">Chevron Lines (C & F) Ltd.</h1>
                  <span className="text-[10px] text-slate-400 block">Leave Management & HR Portal</span>
                </div>
              </div>
              <div className="flex items-center space-x-3">
                {(currentSession.role === 'Manager' || currentSession.role === 'TeamLeader') && (
                  <button
                    onClick={() => setActiveTab('approvals')}
                    className="relative p-2 rounded-xl text-xs font-bold border bg-amber-50 text-amber-800 border-amber-300"
                  >
                    🔔 Pending ({pendingQueue.length})
                  </button>
                )}
                <div className="text-right hidden sm:block">
                  <div className="text-xs font-bold text-slate-800">{currentSession.name}</div>
                  <div className="text-[10px] text-sky-600 uppercase font-semibold">{currentSession.role}</div>
                </div>
                <button onClick={handleLogout} className="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-xl text-xs font-bold transition border border-rose-200">
                  Logout
                </button>
              </div>
            </div>
          </header>

          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold text-white ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
              {toast.msg}
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full flex-grow space-y-6">
            {currentSession.type === 'ADMIN' ? (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white rounded-3xl p-6 shadow-md flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h2 className="text-lg font-bold">Admin Management Control Center</h2>
                    <p className="text-xs text-slate-400">Total Staff: {employees.length} | Recorded Leaves: {leaves.length}</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setIsMonthlyReportOpen(true)} className="bg-sky-500/20 text-sky-300 border border-sky-400/30 px-4 py-2 rounded-xl text-xs font-bold">
                      📊 Monthly Report (A4 Landscape)
                    </button>
                    <button onClick={() => { setEditEmployee(null); setIsEmployeeModalOpen(true); }} className="bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">
                      + Register New Employee
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
                  {/* Left: System Leaves */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                      <h3 className="text-sm font-bold text-slate-900">All System Leave Requests</h3>
                      <span className="text-xs font-bold bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-full">{leaves.length} Applications</span>
                    </div>
                    <div className="overflow-x-auto max-h-[550px]">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold sticky top-0">
                          <tr>
                            <th className="p-3">Applicant</th>
                            <th className="p-3">Type</th>
                            <th className="p-3">Duration</th>
                            <th className="p-3">Status</th>
                            <th className="p-3 text-right">Pass</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {leaves.map(l => (
                            <tr key={l.id} className="hover:bg-slate-50">
                              <td className="p-3 font-bold text-slate-800">{l.applicant_name}</td>
                              <td className="p-3 font-semibold">{l.type}</td>
                              <td className="p-3 text-slate-600">{l.start_date} to {l.end_date}</td>
                              <td className="p-3">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                  l.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' :
                                  l.status === 'Rejected' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'
                                }`}>{l.status}</span>
                              </td>
                              <td className="p-3 text-right">
                                {l.status === 'Approved' ? (
                                  <button onClick={() => setPrintPassLeave(l)} className="bg-sky-50 text-sky-700 px-2 py-1 rounded text-[11px] font-bold">View Pass</button>
                                ) : <span className="text-slate-400">—</span>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Right: Employee Directory */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                      <h3 className="text-sm font-bold text-slate-900">Registered Employee Directory</h3>
                      <span className="text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full">{employees.length} Staff</span>
                    </div>
                    <div className="overflow-x-auto max-h-[550px]">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold sticky top-0">
                          <tr>
                            <th className="p-3">Name & Code</th>
                            <th className="p-3">Department</th>
                            <th className="p-3">Role</th>
                            <th className="p-3">Status</th>
                            <th className="p-3 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {employees.map(emp => (
                            <tr key={emp.id} className="hover:bg-slate-50">
                              <td className="p-3 font-bold text-slate-800">{emp.name} <span className="text-[10px] text-slate-400 block">{emp.employee_code || `ID: ${emp.id}`}</span></td>
                              <td className="p-3 text-slate-700">{emp.department}</td>
                              <td className="p-3 font-semibold text-sky-700">{emp.role}</td>
                              <td className="p-3">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${emp.status === 'Active' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700'}`}>
                                  {emp.status || 'Active'}
                                </span>
                              </td>
                              <td className="p-3 text-right space-x-1">
                                <button onClick={() => setViewProfileEmp(emp)} className="text-slate-600 bg-slate-100 px-2 py-1 rounded text-[11px] font-bold">File</button>
                                <button onClick={() => { setEditEmployee(emp); setIsEmployeeModalOpen(true); }} className="text-sky-600 bg-sky-50 px-2 py-1 rounded text-[11px] font-bold">Edit</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            ) : (
              /* User Portal */
              <div className="space-y-6">
                <div className="bg-slate-900 text-white rounded-3xl p-6 shadow-md flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <span className="text-[11px] bg-sky-500/30 text-sky-200 font-bold px-3 py-1 rounded-full uppercase">{currentSession.role}</span>
                    <h2 className="text-xl font-extrabold mt-2">{currentSession.name}</h2>
                    <p className="text-xs text-sky-200">Department: {currentSession.department}</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => { setEditingLeave(null); setIsApplyOpen(true); }} className="bg-white text-sky-900 font-bold px-4 py-2.5 rounded-xl text-xs">
                      + Apply For Leave
                    </button>
                    {currentSession.role === 'Manager' && (
                      <button onClick={() => setIsMonthlyReportOpen(true)} className="bg-sky-500/30 text-white font-bold px-4 py-2.5 rounded-xl border border-sky-300/30 text-xs">
                        📊 Monthly Report
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex border-b border-slate-200 bg-white rounded-t-2xl px-4 pt-2 gap-2 text-xs font-bold">
                  <button onClick={() => setActiveTab('my-leaves')} className={`pb-3 px-3 border-b-2 ${activeTab === 'my-leaves' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-500'}`}>
                    My Leave Applications
                  </button>
                  {(currentSession.role === 'Manager' || currentSession.role === 'TeamLeader') && (
                    <button onClick={() => setActiveTab('approvals')} className={`pb-3 px-3 border-b-2 relative ${activeTab === 'approvals' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-500'}`}>
                      Approvals Queue {pendingQueue.length > 0 && `(${pendingQueue.length})`}
                    </button>
                  )}
                  {(currentSession.role === 'Manager' || currentSession.role === 'TeamLeader') && (
                    <button onClick={() => setActiveTab('balance')} className={`pb-3 px-3 border-b-2 ${activeTab === 'balance' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-500'}`}>
                      Leave Balances
                    </button>
                  )}
                  <button onClick={() => setActiveTab('profile')} className={`pb-3 px-3 border-b-2 ${activeTab === 'profile' ? 'border-sky-600 text-sky-600' : 'border-transparent text-slate-500'}`}>
                    My HR Record
                  </button>
                </div>

                {/* My Leaves */}
                {activeTab === 'my-leaves' && (
                  <div className="bg-white rounded-b-2xl border border-t-0 border-slate-200 overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold">
                        <tr>
                          <th className="p-4">Type</th>
                          <th className="p-4">Dates</th>
                          <th className="p-4">Days</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {leaves.filter(l => l.applicant_id === currentSession.id || l.applicant_name === currentSession.name).map(l => (
                          <tr key={l.id}>
                            <td className="p-4 font-bold">{l.type}</td>
                            <td className="p-4 text-slate-600">{l.start_date} to {l.end_date}</td>
                            <td className="p-4 font-extrabold">{calculateDays(l.start_date, l.end_date)} Days</td>
                            <td className="p-4"><span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100">{l.status}</span></td>
                            <td className="p-4 text-right">
                              {l.status === 'Approved' ? (
                                <button onClick={() => setPrintPassLeave(l)} className="bg-sky-50 text-sky-700 px-3 py-1 rounded font-bold">Leave Pass</button>
                              ) : (
                                <button onClick={() => handleDeleteLeave(l.id)} className="text-rose-600 bg-rose-50 px-2 py-1 rounded font-bold">Delete</button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* Approvals Queue */}
                {activeTab === 'approvals' && (
                  <div className="bg-white rounded-b-2xl border border-t-0 border-slate-200 p-6 space-y-4">
                    {pendingQueue.map(item => (
                      <div key={item.id} className="p-4 rounded-2xl border bg-slate-50 flex justify-between items-center">
                        <div>
                          <h4 className="font-bold text-sm">{item.applicant_name}</h4>
                          <p className="text-xs text-slate-500">{item.type} ({item.start_date} to {item.end_date})</p>
                          <p className="text-xs italic mt-1">"{item.reason}"</p>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => handleApproveReject(item.id, 'REJECT')} className="px-3 py-1.5 rounded-xl bg-rose-50 text-rose-700 font-bold text-xs">Reject</button>
                          {currentSession.role === 'TeamLeader' && (
                            <button onClick={() => handleApproveReject(item.id, 'FORWARD')} className="px-3 py-1.5 rounded-xl bg-sky-50 text-sky-700 font-bold text-xs">Forward</button>
                          )}
                          <button onClick={() => handleApproveReject(item.id, 'APPROVE')} className="px-4 py-1.5 rounded-xl bg-emerald-600 text-white font-bold text-xs">Approve</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Balances */}
                {activeTab === 'balance' && (
                  <div className="bg-white rounded-b-2xl border border-t-0 border-slate-200 p-6">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold">
                        <tr>
                          <th className="p-3">Staff Name</th>
                          <th className="p-3">Department</th>
                          <th className="p-3">Casual (CL) Taken / 10</th>
                          <th className="p-3">Sick (SL) Taken / 15</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {employees.filter(e => currentSession.role === 'Manager' ? true : e.tl === currentSession.name).map(emp => {
                          const empLeaves = leaves.filter(l => (l.applicant_id === emp.id || l.applicant_name === emp.name) && l.status === 'Approved');
                          const cl = empLeaves.filter(l => l.type.includes('Casual')).reduce((sum, l) => sum + calculateDays(l.start_date, l.end_date), 0);
                          const sl = empLeaves.filter(l => l.type.includes('Sick')).reduce((sum, l) => sum + calculateDays(l.start_date, l.end_date), 0);
                          return (
                            <tr key={emp.id}>
                              <td className="p-3 font-bold">{emp.name}</td>
                              <td className="p-3">{emp.department}</td>
                              <td className="p-3 font-semibold text-sky-700">{cl} / 10</td>
                              <td className="p-3 font-semibold text-indigo-700">{sl} / 15</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* Profile */}
                {activeTab === 'profile' && (
                  <div className="bg-white rounded-b-2xl border border-t-0 border-slate-200 p-6">
                    <div className="p-4 bg-slate-50 rounded-xl space-y-2 text-xs">
                      <div className="flex justify-between"><span className="text-slate-400">Name:</span><span className="font-bold">{currentSession.name}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Department:</span><span>{currentSession.department}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Role:</span><span>{currentSession.role}</span></div>
                      <div className="flex justify-between"><span className="text-slate-400">Status:</span><span className="text-emerald-600 font-bold">Active</span></div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Apply Leave Modal */}
          {isApplyOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4">
                <h3 className="font-bold text-base">Apply For Leave</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveLeave({
                    type: fd.get('type'),
                    start_date: fd.get('start_date'),
                    end_date: fd.get('end_date'),
                    reason: fd.get('reason')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Leave Type</label>
                    <select name="type" className="w-full p-2 border rounded-xl">
                      <option value="Casual Leave (CL)">Casual Leave (CL) - Max 10 Days</option>
                      <option value="Sick Leave (SL)">Sick Leave (SL) - Max 15 Days</option>
                      <option value="Maternity Leave">Maternity Leave</option>
                      <option value="Special Leave">Special Leave</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1">Start Date</label>
                      <input name="start_date" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">End Date</label>
                      <input name="end_date" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-2 border rounded-xl" />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Reason</label>
                    <textarea name="reason" rows="3" required placeholder="Reason for absence..." className="w-full p-2 border rounded-xl"></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setIsApplyOpen(false)} className="px-4 py-2 rounded-xl bg-slate-100 font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-sky-600 text-white font-bold">Submit</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Register / Edit Employee (No Bank / Salary) */}
          {isEmployeeModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 max-h-[90vh] overflow-y-auto">
                <h3 className="font-bold text-base">{editEmployee ? 'Edit Employee' : 'Register New Employee'}</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleSaveEmployee({
                    id: editEmployee?.id,
                    name: fd.get('name'),
                    employee_code: fd.get('employee_code'),
                    role: fd.get('role'),
                    department: fd.get('department'),
                    designation: fd.get('designation'),
                    mobile: fd.get('mobile'),
                    status: fd.get('status')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Full Name *</label>
                    <input name="name" required defaultValue={editEmployee?.name || ''} className="w-full p-2 border rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1">Employee Code</label>
                      <input name="employee_code" defaultValue={editEmployee?.employee_code || ''} className="w-full p-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Role</label>
                      <select name="role" defaultValue={editEmployee?.role || 'Employee'} className="w-full p-2 border rounded-xl">
                        <option value="Employee">Employee</option>
                        <option value="TeamLeader">TeamLeader</option>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Department</label>
                    <select name="department" defaultValue={editEmployee?.department || 'C&F Customs'} className="w-full p-2 border rounded-xl">
                      {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1">Designation</label>
                      <input name="designation" defaultValue={editEmployee?.designation || ''} className="w-full p-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Mobile</label>
                      <input name="mobile" defaultValue={editEmployee?.mobile || ''} className="w-full p-2 border rounded-xl" />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Status</label>
                    <select name="status" defaultValue={editEmployee?.status || 'Active'} className="w-full p-2 border rounded-xl font-bold">
                      <option value="Active">Active</option>
                      <option value="Inactive">Inactive (Resigned/Departed)</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setIsEmployeeModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-sky-600 text-white rounded-xl font-bold">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Leave Pass Modal */}
          {printPassLeave && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 text-center">
                <h3 className="font-bold text-sm">Official Leave Pass</h3>
                <div className="p-4 border rounded-2xl bg-slate-50 text-left text-xs space-y-1.5">
                  <div className="font-bold text-sm text-slate-800">{printPassLeave.applicant_name}</div>
                  <div>Type: <strong>{printPassLeave.type}</strong></div>
                  <div>Dates: {printPassLeave.start_date} to {printPassLeave.end_date}</div>
                  <div>Approved By: <strong>{printPassLeave.approver}</strong></div>
                  <div className="pt-2 text-[10px] text-slate-400 italic text-center">* Digitally verified. No signature required.</div>
                </div>
                <div className="flex justify-end gap-2 no-print">
                  <button onClick={() => setPrintPassLeave(null)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-xs">Close</button>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-sky-600 text-white rounded-xl font-bold text-xs">Print Pass</button>
                </div>
              </div>
            </div>
          )}

          {/* Monthly Report Modal (A4 Landscape) */}
          {isMonthlyReportOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-4xl w-full space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center no-print">
                  <h3 className="font-bold text-base">Monthly Leave Report (A4 Landscape)</h3>
                  <button onClick={() => setIsMonthlyReportOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="p-6 border rounded-2xl bg-white space-y-4">
                  <div className="text-center border-b pb-2">
                    <h2 className="font-extrabold text-lg">Chevron Lines (C & F) Ltd.</h2>
                    <p className="text-xs text-slate-500">Aziz Court, Agrabad C/A, Chittagong • Monthly Leave Audit</p>
                  </div>
                  <table className="w-full text-xs border border-slate-300 text-left">
                    <thead className="bg-slate-900 text-white">
                      <tr>
                        <th className="p-2 border">Department</th>
                        <th className="p-2 border text-center">Staff</th>
                        <th className="p-2 border text-center">CL Days</th>
                        <th className="p-2 border text-center">SL Days</th>
                        <th className="p-2 border text-center">Total Days</th>
                      </tr>
                    </thead>
                    <tbody>
                      {DEPARTMENTS.map(d => {
                        const dLeaves = leaves.filter(l => {
                          const emp = employees.find(e => e.id === l.applicant_id || e.name === l.applicant_name);
                          return emp?.department === d && l.status === 'Approved';
                        });
                        const cl = dLeaves.filter(l => l.type.includes('Casual')).reduce((acc, l) => acc + calculateDays(l.start_date, l.end_date), 0);
                        const sl = dLeaves.filter(l => l.type.includes('Sick')).reduce((acc, l) => acc + calculateDays(l.start_date, l.end_date), 0);
                        return (
                          <tr key={d}>
                            <td className="p-2 border font-bold">{d}</td>
                            <td className="p-2 border text-center">{employees.filter(e => e.department === d).length}</td>
                            <td className="p-2 border text-center text-sky-700 font-semibold">{cl}</td>
                            <td className="p-2 border text-center text-indigo-700 font-semibold">{sl}</td>
                            <td className="p-2 border text-center font-extrabold text-amber-700">{cl + sl} Days</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div className="pt-2 text-[10px] text-slate-400 italic text-right">* System generated official audit document — No manual signature required.</div>
                </div>
                <div className="flex justify-end gap-2 no-print">
                  <button onClick={() => setIsMonthlyReportOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-xs">Close</button>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-sky-600 text-white rounded-xl font-bold text-xs">Print Report</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
